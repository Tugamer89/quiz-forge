name: PR Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:run

      - name: Build for Lighthouse
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

      # 'if: always()' ensures the report is generated even if Lighthouse assertions fail
      - name: Format Lighthouse Score
        id: format_lighthouse_score
        if: always()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const path = require('path');
            const scriptPath = path.resolve(process.env.GITHUB_WORKSPACE, '.github/scripts/format-lighthouse-report.cjs');
            const formatReport = require(scriptPath);
            return formatReport({ core });

      - name: Add PR Comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          header: lighthouse
          message: ${{ steps.format_lighthouse_score.outputs.result || '⚠️ Unable to generate Lighthouse report.' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Dry Run Docker Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            VITE_APP_VERSION=pr-test
            VITE_GOOGLE_CLIENT_ID=dummy_google_client_id
            VITE_SENTRY_DSN=dummy_sentry_dsn
          secrets: |
            "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}"
