name: PR Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  audit-and-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:run

      - name: Build for Lighthouse and Preview
        run: npm run build

      - name: Prepare Surge Preview
        run: |
          mkdir -p .surge-preview/quiz-forge
          cp -a dist/. .surge-preview/quiz-forge/
          cp dist/index.html .surge-preview/200.html

      - name: Deploy PR Preview to Surge
        id: surge_deploy
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          npx surge ./.surge-preview quiz-forge-pr-${{ github.event.pull_request.number }}.surge.sh

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Format Lighthouse Score
        id: format_lighthouse_score
        if: always()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const path = require('path');
            const scriptPath = path.resolve(process.env.GITHUB_WORKSPACE, '.github/scripts/format-lighthouse-report.cjs');
            const formatReport = require(scriptPath);
            return formatReport({ core });

      - name: Add PR Comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          header: pr-summary
          message: |
            ### UI Preview
            The preview for this Pull Request is live at: **[https://quiz-forge-pr-${{ github.event.pull_request.number }}.surge.sh/quiz-forge/](https://quiz-forge-pr-${{ github.event.pull_request.number }}.surge.sh/quiz-forge/)**

            ### Lighthouse Score
            ${{ steps.format_lighthouse_score.outputs.result || 'Unable to generate Lighthouse report.' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Dry Run Docker Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            VITE_APP_VERSION=pr-test
            VITE_GOOGLE_CLIENT_ID=dummy_google_client_id
            VITE_SENTRY_DSN=dummy_sentry_dsn
          secrets: |
            "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}"

  teardown-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove Surge Preview
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          npx surge teardown quiz-forge-pr-${{ github.event.pull_request.number }}.surge.sh
